{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>➕ Thêm học kỳ</h2>
    <form method="POST" action="/admin/terms/add" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
        <div>
            <label>Năm học</label>
            <input type="number" name="year" value="2024" style="width:120px">
        </div>
        <div>
            <label>Học kỳ</label>
            <select name="semester" style="width:120px">
                <option value="1">HK1</option>
                <option value="2">HK2</option>
            </select>
        </div>
        <button class="btn btn-primary">Thêm</button>
    </form>
</div>

<div class="card">
    <h2>📅 Danh sách học kỳ</h2>
    <table>
        <tr><th>Năm</th><th>Học kỳ</th><th>Trạng thái</th><th></th></tr>
        {% for t in terms %}
        <tr>
            <td>{{ t.year }}</td>
            <td>HK{{ t.semester }}</td>
            <td>
                {% if t.is_current %}
                    <span class="badge badge-green">✅ Hiện tại</span>
                {% else %}
                    <span class="badge">—</span>
                {% endif %}
            </td>
            <td>
                {% if not t.is_current %}
                <a href="/admin/terms/set_current/{{ t.id }}" class="btn btn-primary" style="font-size:12px;padding:4px 10px">Đặt làm hiện tại</a>
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
